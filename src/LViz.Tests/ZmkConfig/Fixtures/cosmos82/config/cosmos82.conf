# Cosmos 82 - user configuration, applied to BOTH halves.
# Per-half overrides go in config/cosmos82_left.conf / cosmos82_right.conf.

# --- Power -------------------------------------------------------------------
# Deep sleep. Wakes on a keypress (the kscan is a wakeup-source). Big win for
# battery life on a 2-cell wireless split.
CONFIG_ZMK_SLEEP=y
# Idle after 30s, deep sleep after 15min of inactivity.
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# --- Battery reporting -------------------------------------------------------
# Both are required to see the LEFT (peripheral) half's battery level: the
# central fetches it over BLE, then proxies it to the host. Note that host
# support for a second battery level is inconsistent.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# --- Handy while bringing the board up ---------------------------------------
# Uncomment to get USB logging on the central (costs power, disables deep
# sleep in practice - turn it back off once the board works).
# CONFIG_ZMK_USB_LOGGING=y

# --- Mouse / pointing --------------------------------------------------------
# Required for the &mkp mouse-button bindings. Without it they compile fine but
# silently do nothing. Also needed for the Stage-2 PMW3610 trackballs.
# NOTE: this changes the HID report descriptor, so you must forget and re-pair
# the keyboard on each host before mouse events work over BLE.
CONFIG_ZMK_POINTING=y

# --- Trackballs (Stage 2) ----------------------------------------------------
# CONFIG_ZMK_POINTING above is also required and is already set.
CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_PMW3610=y
