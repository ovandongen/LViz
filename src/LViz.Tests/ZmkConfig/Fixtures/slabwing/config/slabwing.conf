# P0.09 / P0.10 are NFC pins on the nRF52840; we use them as matrix columns.
CONFIG_NFCT_PINS_AS_GPIOS=y

# Battery-friendly defaults
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# --- Mouse / pointing --------------------------------------------------------
# Required for the &mkp mouse-button bindings. Without it they compile fine but
# silently do nothing. Also needed for the Stage-2 PMW3610 trackballs.
# NOTE: this changes the HID report descriptor, so you must forget and re-pair
# the keyboard on each host before mouse events work over BLE.
CONFIG_ZMK_POINTING=y

# nice!view: header faces the inside of the case, so the panel is upright in its
# native landscape orientation. Custom landscape status screen: src/slabwing_status_screen.c
# (the stock nice!view screen is drawn rotated 90 deg, so it is switched off).
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_NICE_VIEW_WIDGET_STATUS=n
CONFIG_LV_USE_LABEL=y
CONFIG_LV_USE_LINE=y
CONFIG_LV_USE_THEME_MONO=y
CONFIG_LV_FONT_MONTSERRAT_16=y
CONFIG_LV_FONT_MONTSERRAT_28=y
